# Mounted into conf.d/ by compose.tls.yaml. Adds an HTTPS listener and turns
# the plain-HTTP vhost into a redirect.
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module           modules/mod_ssl.so

Listen 8443
Define FORCE_HTTPS

Mutex file:/tmp default
SSLRandomSeed startup builtin
SSLRandomSeed connect builtin
SSLSessionCache shmcb:/tmp/ssl_scache(512000)
SSLSessionCacheTimeout 300
SSLSessionTickets off
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
SSLHonorCipherOrder off
SSLCompression off

# Unknown Host header on HTTPS: refuse, as on HTTP.
<VirtualHost *:8443>
    ServerName default.invalid
    SSLEngine on
    SSLCertificateFile    /certs/fullchain.pem
    SSLCertificateKeyFile /certs/privkey.pem
    ErrorDocument 403 "Forbidden"
    RewriteEngine On
    RewriteRule ^ - [F]
</VirtualHost>

<VirtualHost *:8443>
    ServerName ${SERVER_NAME}
    SSLEngine on
    SSLCertificateFile    /certs/fullchain.pem
    SSLCertificateKeyFile /certs/privkey.pem
    # One year, this host only. Add includeSubDomains/preload deliberately.
    Header always set Strict-Transport-Security "max-age=31536000"
    Include conf/rules.conf
</VirtualHost>
