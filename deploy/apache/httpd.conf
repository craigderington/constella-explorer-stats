# Locked-down Apache 2.4 reverse proxy for the Catasterism companion.
# Runs unprivileged on :8080, GET/HEAD only, allowlist-routed (see rules.conf).

ServerRoot "/usr/local/apache2"
Define APP_ORIGIN http://app:5150

# Only what is needed. No autoindex, cgi, userdir, status, dav, ssl, php, ...
LoadModule mpm_event_module     modules/mod_mpm_event.so
LoadModule unixd_module         modules/mod_unixd.so
LoadModule authz_core_module    modules/mod_authz_core.so
LoadModule log_config_module    modules/mod_log_config.so
LoadModule env_module           modules/mod_env.so
LoadModule setenvif_module      modules/mod_setenvif.so
LoadModule mime_module          modules/mod_mime.so
LoadModule filter_module        modules/mod_filter.so
LoadModule deflate_module       modules/mod_deflate.so
LoadModule headers_module       modules/mod_headers.so
LoadModule reqtimeout_module    modules/mod_reqtimeout.so
LoadModule alias_module         modules/mod_alias.so
LoadModule rewrite_module       modules/mod_rewrite.so
LoadModule proxy_module         modules/mod_proxy.so
LoadModule proxy_http_module    modules/mod_proxy_http.so

Listen 8080
PidFile /tmp/httpd.pid
ServerName ${SERVER_NAME}

ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None
HostnameLookups Off
UseCanonicalName Off
HttpProtocolOptions Strict
AllowEncodedSlashes Off

# --- Slowloris and oversized-request limits ---
Timeout 10
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 3
RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500
LimitRequestLine 512
LimitRequestFields 25
LimitRequestFieldSize 2048
LimitRequestBody 1024

<IfModule mpm_event_module>
    StartServers            2
    ServerLimit             6
    ThreadsPerChild        25
    MaxRequestWorkers     150
    MaxConnectionsPerChild  10000
</IfModule>

# --- Nothing on disk is served except by explicit Alias ---
DocumentRoot "/usr/local/apache2/htdocs"
<Directory />
    AllowOverride None
    Options None
    Require all denied
</Directory>
<Directory "/usr/local/apache2/static">
    Require all granted
</Directory>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

TypesConfig conf/mime.types
DefaultType none
AddOutputFilterByType DEFLATE text/html text/plain application/json image/svg+xml

# --- Logs go to the container's stdout/stderr ---
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%a %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %{ms}Tms" access
CustomLog /proc/self/fd/1 access

# Never forward client-supplied proxy headers to the app, or the httpoxy
# `Proxy` header.
RequestHeader unset Proxy early
RequestHeader unset X-Forwarded-For early
RequestHeader unset X-Forwarded-Host early
RequestHeader unset X-Forwarded-Proto early
RequestHeader unset Forwarded early
RequestHeader unset X-Real-IP early

ProxyRequests Off
ProxyVia Off
ProxyTimeout 10

# Optional extra configuration (the TLS override mounts a file here).
IncludeOptional conf.d/*.conf

# Catch-all: a request whose Host header is not ours (IP scans, bad vhost
# probes) is refused before any rule runs.
<VirtualHost *:8080>
    ServerName default.invalid
    ErrorDocument 403 "Forbidden"
    RewriteEngine On
    RewriteRule ^ - [F]
</VirtualHost>

<VirtualHost *:8080>
    ServerName ${SERVER_NAME}
    # With the TLS override (compose.tls.yaml) plain HTTP only redirects.
    <IfDefine FORCE_HTTPS>
        RewriteEngine On
        # robots.txt stays answerable over HTTP: it is the container healthcheck.
        RewriteCond %{REQUEST_URI} !^/robots\.txt$
        RewriteRule ^ ${HTTPS_ORIGIN}%{REQUEST_URI} [R=308,L]
        Alias /robots.txt /usr/local/apache2/static/robots.txt
    </IfDefine>
    <IfDefine !FORCE_HTTPS>
        Include conf/rules.conf
    </IfDefine>
</VirtualHost>
