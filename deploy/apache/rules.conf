# Shared by the HTTP and TLS virtual hosts.
#
# Policy: refuse by default. Only the pages this site actually has are ever
# forwarded to the app; everything else is a 403 that never reaches it.

ErrorDocument 400 "Forbidden"
ErrorDocument 401 "Forbidden"
ErrorDocument 403 "Forbidden"
ErrorDocument 404 "Forbidden"
ErrorDocument 405 "Forbidden"
ErrorDocument 408 "Forbidden"
ErrorDocument 414 "Forbidden"
ErrorDocument 431 "Forbidden"
ErrorDocument 500 "Unavailable"
ErrorDocument 502 "Unavailable"
ErrorDocument 503 "Unavailable"
ErrorDocument 504 "Unavailable"

# --- Security headers on every response, errors included ---
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "no-referrer"
Header always set Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()"
Header always set Cross-Origin-Opener-Policy "same-origin"
Header always set Cross-Origin-Resource-Policy "same-origin"
# The page uses inline <style> and style attributes and loads its two fonts
# from Google Fonts; nothing else is allowed.
Header always set Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
# Strip what the app and the proxy would otherwise advertise. Both tables are
# needed: `always` covers error responses, the plain form covers proxied 2xx.
Header always unset X-Powered-By
Header unset X-Powered-By
Header always unset Via
Header unset Via
Header unset X-Request-Id

# --- Who is asking? ---
# Empty user agent, search/SEO/AI crawlers, scraping libraries, command-line
# fetchers, headless browsers and the usual vulnerability scanners.
SetEnvIfNoCase User-Agent "^$" bad_client
SetEnvIfNoCase User-Agent "(bot|crawl|spider|slurp|scrap|harvest|archiver|fetcher|checker|monitor|probe|scan)" bad_client
SetEnvIfNoCase User-Agent "(curl|wget|libwww|lwp|python|aiohttp|httpx|urllib|requests|go-http|okhttp|java/|apache-http|jakarta|node-fetch|axios|undici|got/|guzzle|php/|ruby|perl|powershell|winhttp)" bad_client
SetEnvIfNoCase User-Agent "(headless|phantom|selenium|puppeteer|playwright|webdriver|electron)" bad_client
SetEnvIfNoCase User-Agent "(nikto|sqlmap|nmap|masscan|zgrab|zmap|nuclei|gobuster|dirbuster|dirb|wfuzz|ffuf|feroxbuster|hydra|havij|acunetix|netsparker|openvas|nessus|burp|zaproxy|wpscan|whatweb|metasploit|jaeles|xray|fuzz|inspect|expanse|censys|shodan|netcraft|internet-measurement)" bad_client
SetEnvIfNoCase User-Agent "(semrush|ahrefs|mj12|dotbot|petalbot|bytespider|gptbot|claudebot|ccbot|amazonbot|dataforseo|blexbot|seokicks|megaindex|serpstat|zoominfo|barkrowler|yandex|baidu|sogou|exabot)" bad_client

RewriteEngine On

# GET and HEAD only. This is a read-only site.
RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$
RewriteRule ^ - [F,L]

RewriteCond %{ENV:bad_client} =1
RewriteRule ^ - [F,L]

# Traversal, encoded slashes/nulls/newlines, template and shell injection
# in the raw request line.
RewriteCond %{THE_REQUEST} (\.\./|\.\.\\|%2e%2e|%2f|%5c|%00|%0d|%0a|\\|<|>|%3c|%3e|\$\{|\{\{|`|;) [NC]
RewriteRule ^ - [F,L]

# robots.txt is answered here and never forwarded.
Alias /robots.txt /usr/local/apache2/static/robots.txt

# --- The allowlist: the only URLs that ever reach the app ---
RewriteCond %{QUERY_STRING} ^$
RewriteRule ^/$ ${APP_ORIGIN}/ [P,L]

RewriteCond %{QUERY_STRING} ^$
RewriteRule ^/favicon\.(svg|ico)$ ${APP_ORIGIN}/favicon.$1 [P,L]

# The JSON feeds accept only paging parameters, with sane bounds.
RewriteCond %{QUERY_STRING} ^$ [OR]
RewriteCond %{QUERY_STRING} ^(page=[0-9]{1,6}|page_size=([1-9][0-9]?|100))(&(page=[0-9]{1,6}|page_size=([1-9][0-9]?|100)))?$
RewriteRule ^/api/chain/(status|snapshots|blocks)$ ${APP_ORIGIN}/api/chain/$1 [P,L]

# Everything else — wp-login.php, .env, .git, phpmyadmin, /admin, /_health,
# /cgi-bin, backups, shells — does not exist here.
RewriteCond %{REQUEST_URI} !^/robots\.txt$
RewriteRule ^ - [F]

ProxyPassReverse / ${APP_ORIGIN}/
