# /etc/apache2/sites-available/stats.catasterism.xyz.conf
#
#   internet --443--> this Apache (TLS, allowlist) --> 127.0.0.1:8088
#                     (compose proxy: crawler/scanner rules) --> app
#
# Needs: a2enmod ssl proxy proxy_http headers rewrite reqtimeout socache_shmcb
# and `HTTP_PORT=8088`, `BIND_ADDR=127.0.0.1`, `SERVER_NAME=stats.catasterism.xyz`
# in the stack's .env. The compose proxy checks the Host header, so it is
# passed through unchanged.

Define STATS_HOST stats.catasterism.xyz
Define CERT_DIR   /etc/letsencrypt/live/stats.catasterism.xyz

# ---- :80 — ACME challenges and a redirect, nothing else ----
<VirtualHost *:80>
    ServerName default.invalid
    RewriteEngine On
    RewriteRule ^ - [F]
</VirtualHost>

<VirtualHost *:80>
    ServerName ${STATS_HOST}
    ServerSignature Off

    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme/.well-known/acme-challenge/>
        Require all granted
        Options None
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://${STATS_HOST}/ [R=308,L]
</VirtualHost>

# ---- :443 — any other Host name is refused ----
<VirtualHost *:443>
    ServerName default.invalid
    SSLEngine on
    SSLCertificateFile    ${CERT_DIR}/fullchain.pem
    SSLCertificateKeyFile ${CERT_DIR}/privkey.pem
    RewriteEngine On
    RewriteRule ^ - [F]
</VirtualHost>

<VirtualHost *:443>
    ServerName ${STATS_HOST}
    SSLEngine on
    SSLCertificateFile    ${CERT_DIR}/fullchain.pem
    SSLCertificateKeyFile ${CERT_DIR}/privkey.pem

    ErrorDocument 400 "Forbidden"
    ErrorDocument 403 "Forbidden"
    ErrorDocument 404 "Forbidden"
    ErrorDocument 405 "Forbidden"
    ErrorDocument 414 "Forbidden"
    ErrorDocument 502 "Unavailable"
    ErrorDocument 503 "Unavailable"
    ErrorDocument 504 "Unavailable"

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"

    # Proxy to the stack on loopback only.
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 15
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader unset Proxy early

    RewriteEngine On

    # Read-only site.
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$
    RewriteRule ^ - [F,L]

    # Traversal, encoded slashes/nulls/newlines, injection characters.
    RewriteCond %{THE_REQUEST} (\.\./|%2e%2e|%2f|%5c|%00|%0d|%0a|\\|<|>|%3c|%3e|\$\{|\{\{|`|;) [NC]
    RewriteRule ^ - [F,L]

    # The allowlist: the only URLs that are ever forwarded.
    RewriteCond %{QUERY_STRING} ^$
    RewriteRule ^/(robots\.txt|favicon\.svg|favicon\.ico)?$ http://127.0.0.1:8088/$1 [P,L]

    RewriteCond %{QUERY_STRING} ^$ [OR]
    RewriteCond %{QUERY_STRING} ^(page=[0-9]{1,6}|page_size=([1-9][0-9]?|100))(&(page=[0-9]{1,6}|page_size=([1-9][0-9]?|100)))?$
    RewriteRule ^/(api/chain/(status|snapshots|blocks))$ http://127.0.0.1:8088/$1 [P,L]

    RewriteRule ^ - [F]

    ProxyPassReverse / http://127.0.0.1:8088/

    ErrorLog  ${APACHE_LOG_DIR}/stats-error.log
    CustomLog ${APACHE_LOG_DIR}/stats-access.log combined
    LogLevel warn
</VirtualHost>
