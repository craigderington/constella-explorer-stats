# Server-wide hardening for the host's Apache. Debian/Ubuntu:
#   /etc/apache2/conf-available/stats-hardening.conf  ->  a2enconf stats-hardening
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None
Header always unset X-Powered-By
Header unset X-Powered-By

# Slow-loris and oversized-request limits. This site only ever serves GETs.
Timeout 20
KeepAlive On
KeepAliveTimeout 3
MaxKeepAliveRequests 100
RequestReadTimeout header=10-20,MinRate=500 body=5,MinRate=500
LimitRequestLine 2048
LimitRequestFields 40
LimitRequestFieldSize 4096
LimitRequestBody 1024

# Modern TLS only.
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
SSLHonorCipherOrder off
SSLCompression off
SSLSessionTickets off
SSLUseStapling on
SSLStaplingCache shmcb:${APACHE_RUN_DIR}/ssl_stapling(32768)

# Nothing is served from disk by default.
<Directory />
    Require all denied
    Options None
    AllowOverride None
</Directory>
