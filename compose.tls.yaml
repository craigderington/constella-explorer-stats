# HTTPS for the proxy. Usage:
#   mkdir -p deploy/certs   # fullchain.pem + privkey.pem, readable by uid 82
#   docker compose -f compose.yaml -f compose.tls.yaml up -d
# Set in .env:  BIND_ADDR=0.0.0.0  HTTP_PORT=80  HTTPS_PORT=443
#               PUBLIC_URL=https://your-domain  SERVER_NAME=your-domain
services:
  proxy:
    environment:
      HTTPS_ORIGIN: ${PUBLIC_URL:?set PUBLIC_URL to the https origin}
    ports: !override
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:8080"
      - "${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    volumes:
      - ./deploy/apache/tls.conf:/usr/local/apache2/conf.d/tls.conf:ro
      - ./deploy/certs:/certs:ro
